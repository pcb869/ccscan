[project]
name = "ccscan"
version = "0.1.0"
description = "Static scanner for what a checkout asks Claude Code to do: .claude/ settings, hooks, agents, skills, .mcp.json, plugin manifests, CLAUDE.md"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
ccscan = "ccscan:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
